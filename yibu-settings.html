<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>一步 Yibu — 导师设置</title>
  <style>
    :root {
      --teal: #0d8f7e;
      --teal-dark: #0a6e61;
      --teal-deep: #08574d;
      --teal-soft: #e7f6f3;
      --teal-mid: #b9e3db;
      --bg: #f3f7f6;
      --bg-tint: #eaf3f1;
      --card: #ffffff;
      --ink: #142421;
      --muted: #5a6e69;
      --line: #d5e3df;
      --learner: #eef2f1;
      --shadow: 0 8px 28px rgba(20, 36, 33, 0.08), 0 1px 2px rgba(20, 36, 33, 0.04);
      --radius: 20px;
      --font: ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      --focus: 0 0 0 3px var(--card), 0 0 0 5px var(--teal);
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background:
        radial-gradient(1200px 500px at 10% -10%, #d9f3ee 0%, transparent 55%),
        radial-gradient(900px 400px at 100% 0%, #e8f4e8 0%, transparent 50%),
        var(--bg);
      color: var(--ink);
      line-height: 1.5;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      width: min(720px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 48px;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }

    .mark {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(160deg, #19b39f 0%, var(--teal-dark) 100%);
      color: #fff;
      font-weight: 750;
      font-size: 1.35rem;
      letter-spacing: -0.04em;
      display: grid;
      place-items: center;
      box-shadow: 0 6px 16px rgba(13, 143, 126, 0.28);
      flex-shrink: 0;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.35rem;
      letter-spacing: -0.03em;
      line-height: 1.2;
    }

    .brand p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .home-link {
      margin-left: auto;
      color: var(--teal-dark);
      font-weight: 650;
      font-size: 0.88rem;
      text-decoration: none;
      padding: 8px 2px;
      white-space: nowrap;
    }

    .home-link:hover { text-decoration: underline; }

    .home-link:focus { outline: none; }

    .home-link:focus-visible { box-shadow: var(--focus); border-radius: 8px; }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid rgba(213, 227, 223, 0.8);
      padding: 22px 22px 20px;
    }

    .card + .card { margin-top: 16px; }

    .card h2 {
      margin: 0 0 4px;
      font-size: 1.12rem;
      letter-spacing: -0.02em;
    }

    .lede, .preview-kicker {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .setting { margin-bottom: 18px; }

    .setting-label {
      display: block;
      font-weight: 650;
      font-size: 0.95rem;
      margin-bottom: 2px;
    }

    .setting-help {
      display: block;
      color: var(--muted);
      font-size: 0.82rem;
      margin-bottom: 8px;
    }

    .segments {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 4px;
      background: var(--bg-tint);
      border: 1px solid var(--line);
      border-radius: 14px;
    }

    .segments button {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-weight: 600;
      font-size: 0.88rem;
      min-height: 44px;
      padding: 8px 6px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
    }

    .segments button:hover:not([aria-pressed="true"]) {
      background: rgba(255, 255, 255, 0.7);
    }

    .segments button[aria-pressed="true"] {
      background: var(--card);
      color: var(--teal-dark);
      box-shadow: 0 1px 2px rgba(20, 36, 33, 0.08), 0 0 0 1px rgba(13, 143, 126, 0.16);
    }

    .segments button:focus { outline: none; }

    .segments button:focus-visible {
      outline: none;
      box-shadow: var(--focus);
      position: relative;
      z-index: 1;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 16px;
      margin-top: 6px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .summary {
      margin: 0;
      flex: 1 1 220px;
      color: var(--muted);
      font-size: 0.86rem;
    }

    .summary strong { color: var(--ink); font-weight: 650; }

    #reset {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--teal-dark);
      font: inherit;
      font-weight: 650;
      font-size: 0.88rem;
      min-height: 44px;
      padding: 8px 14px;
      border-radius: 12px;
      cursor: pointer;
      margin-left: auto;
    }

    #reset:hover { border-color: var(--teal-mid); background: var(--teal-soft); }

    #reset:focus { outline: none; }

    #reset:focus-visible { box-shadow: var(--focus); }

    .chat {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      max-width: 100%;
    }

    .row.yibu-row { flex-direction: row; }

    .row.you-row { flex-direction: row; }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 0.72rem;
      font-weight: 700;
      flex-shrink: 0;
      letter-spacing: 0.02em;
    }

    .avatar.you {
      background: #dfe7e5;
      color: #3d524e;
    }

    .avatar.yibu {
      background: linear-gradient(160deg, #19b39f, var(--teal-dark));
      color: #fff;
    }

    .bubble-wrap { min-width: 0; flex: 1; }

    .who {
      font-size: 0.75rem;
      font-weight: 650;
      color: var(--muted);
      margin: 0 0 4px 6px;
    }

    .bubble {
      border-radius: 16px;
      padding: 11px 14px;
      font-size: 0.95rem;
      line-height: 1.55;
    }

    .bubble.you {
      background: var(--learner);
      color: var(--ink);
      border-bottom-left-radius: 6px;
    }

    .bubble.yibu {
      background: var(--teal-soft);
      color: var(--ink);
      border: 1px solid #cfeae5;
      border-bottom-left-radius: 6px;
    }

    .bubble.cut {
      font-style: italic;
    }

    .interrupt-note {
      margin: 14px 0 0;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .preview-card .preview-kicker { margin-bottom: 14px; }

    @media (max-width: 520px) {
      .app { width: min(720px, calc(100% - 20px)); padding-top: 20px; }
      .card { padding: 18px 16px 16px; border-radius: 16px; }
      .segments button { font-size: 0.8rem; padding: 8px 4px; }
      #reset { width: 100%; margin-left: 0; }
      .summary { flex-basis: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .segments button, #reset { transition: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="mark" aria-hidden="true">Y</div>
      <div class="brand">
        <h1>一步 Yibu</h1>
        <p>你的贴心英语导师</p>
      </div>
      <a class="home-link" href="index.html">返回首页</a>
    </header>

    <main>
      <section class="card" aria-labelledby="settings-heading">
        <h2 id="settings-heading">导师设置</h2>
        <p class="lede">选择一步如何帮你练习。预览会随着你的选择即时更新。</p>

        <div class="setting">
          <span class="setting-label" id="correction-label">纠错严格程度</span>
          <span class="setting-help" id="correction-help">一步纠正错误时有多严格</span>
          <div class="segments" role="group" aria-labelledby="correction-label" aria-describedby="correction-help" data-setting="correction">
            <button type="button" data-value="off" aria-pressed="false">关闭</button>
            <button type="button" data-value="light" aria-pressed="false">轻度</button>
            <button type="button" data-value="strict" aria-pressed="false">严格</button>
          </div>
        </div>

        <div class="setting">
          <span class="setting-label" id="topic-label">话题风格</span>
          <span class="setting-help" id="topic-help">一步会把对话引向什么方向</span>
          <div class="segments" role="group" aria-labelledby="topic-label" aria-describedby="topic-help" data-setting="topic">
            <button type="button" data-value="free-chat" aria-pressed="false">自由聊天</button>
            <button type="button" data-value="news" aria-pressed="false">新闻</button>
            <button type="button" data-value="interests" aria-pressed="false">兴趣</button>
          </div>
        </div>

        <div class="setting">
          <span class="setting-label" id="interruption-label">打断频率</span>
          <span class="setting-help" id="interruption-help">你说话时，一步会多久插话一次</span>
          <div class="segments" role="group" aria-labelledby="interruption-label" aria-describedby="interruption-help" data-setting="interruption">
            <button type="button" data-value="never" aria-pressed="false">从不</button>
            <button type="button" data-value="when-needed" aria-pressed="false">需要时</button>
            <button type="button" data-value="often" aria-pressed="false">经常</button>
          </div>
        </div>

        <div class="toolbar">
          <p class="summary" id="summary" aria-live="polite"></p>
          <button type="button" id="reset">恢复默认设置</button>
        </div>
      </section>

      <section class="card preview-card" aria-labelledby="preview-heading">
        <h2 id="preview-heading">实时预览</h2>
        <p class="preview-kicker">一段带有常见错误的练习对话：“Yesterday I go to the park.”</p>
        <div class="chat" id="chat">
          <div class="row you-row">
            <div class="avatar you" aria-hidden="true">你</div>
            <div class="bubble-wrap">
              <p class="who">你</p>
              <div class="bubble you" id="learner-bubble"></div>
            </div>
          </div>
          <div class="row yibu-row">
            <div class="avatar yibu" aria-hidden="true">Y</div>
            <div class="bubble-wrap">
              <p class="who">一步</p>
              <div class="bubble yibu" id="yibu-bubble" aria-live="polite"></div>
            </div>
          </div>
        </div>
        <p class="interrupt-note" id="interrupt-note"></p>
      </section>
    </main>
  </div>

  <script>
    (function () {
      "use strict";

      var STORAGE_KEY = "yibu-settings";
      var DEFAULTS = {
        correction: "light",
        topic: "free-chat",
        interruption: "when-needed"
      };

      var ALLOWED = {
        correction: { off: true, light: true, strict: true },
        topic: { "free-chat": true, news: true, interests: true },
        interruption: { never: true, "when-needed": true, often: true }
      };

      var LABELS = {
        correction: { off: "关闭", light: "轻度", strict: "严格" },
        topic: { "free-chat": "自由聊天", news: "新闻", interests: "兴趣" },
        interruption: { never: "从不", "when-needed": "需要时", often: "经常" }
      };

      var LEARNER = {
        never: "Yesterday I go to the park. It was really nice and I stay for an hour.",
        "when-needed": "Yesterday I go to the park.",
        often: "Yesterday I go to the—"
      };

      var CORRECTION = {
        off: {
          never: "真是一次愉快的出行——谢谢你告诉我。",
          "when-needed": "语法我就先不改了。听起来真是一次很棒的出行。",
          often: "哦，我不是故意打断你的——听起来已经是一次很棒的出行了！"
        },
        light: {
          never: "很棒。所以昨天你去了公园：yesterday you went to the park。",
          "when-needed": "你说完了，我轻轻改一下：yesterday you went to the park。",
          often: "——是 you went to the park，对吗？只是轻轻改一下。"
        },
        strict: {
          never: "继续之前，先说一个语法：我们说 “Yesterday I went to the park，” 而不是 “I go。” 在 “yesterday” 后面要用过去式 “went”。",
          "when-needed": "最后改一处：应该说 “I went to the park，” 而不是 “I go。” “Went” 是 “go” 的过去式。",
          often: "等一下——是 “I went，” 不是 “I go。” “Yesterday” 已经标明是过去，所以要用 “went”。"
        }
      };

      var TOPIC = {
        "free-chat": {
          never: "我很想听听你在那儿做了什么，以及那天剩下的时间是怎么过的。",
          "when-needed": "你在公园里做了什么？是和别人一起去的吗？",
          often: "你到了之后做了什么？"
        },
        news: {
          never: "我也很好奇，你有没有看到关于本市公园翻新计划的新闻。",
          "when-needed": "你看过本周关于本市公园翻新的新闻吗？",
          often: "你有没有关注本市公园翻新计划的新闻？"
        },
        interests: {
          never: "我也想知道，户外活动是你平时的兴趣之一，还是偶尔的享受。",
          "when-needed": "在公园散步是你的兴趣之一，还是这次只是偶尔去一下？",
          often: "你喜欢公园和户外活动吗，还是这次只是偶尔去一次？"
        }
      };

      var INTERRUPT_NOTE = {
        never: "一步会等你说完，再完整回复。",
        "when-needed": "一步会等你说完，如果有值得提醒的地方再介入。",
        often: "一步会在你话说到一半时插进来。"
      };

      var state = loadState();

      var learnerBubble = document.getElementById("learner-bubble");
      var yibuBubble = document.getElementById("yibu-bubble");
      var summaryEl = document.getElementById("summary");
      var noteEl = document.getElementById("interrupt-note");
      var resetBtn = document.getElementById("reset");

      function loadState() {
        var next = {
          correction: DEFAULTS.correction,
          topic: DEFAULTS.topic,
          interruption: DEFAULTS.interruption
        };
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return next;
          var parsed = JSON.parse(raw);
          if (parsed && typeof parsed === "object") {
            if (ALLOWED.correction[parsed.correction]) next.correction = parsed.correction;
            if (ALLOWED.topic[parsed.topic]) next.topic = parsed.topic;
            if (ALLOWED.interruption[parsed.interruption]) next.interruption = parsed.interruption;
          }
        } catch (err) {
          /* keep defaults if storage is unavailable or corrupt */
        }
        return next;
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            correction: state.correction,
            topic: state.topic,
            interruption: state.interruption
          }));
        } catch (err) {
          /* ignore quota / private-mode errors */
        }
      }

      function yibuReply() {
        return CORRECTION[state.correction][state.interruption] + " " +
          TOPIC[state.topic][state.interruption];
      }

      function render() {
        document.querySelectorAll(".segments").forEach(function (group) {
          var key = group.getAttribute("data-setting");
          group.querySelectorAll("button[data-value]").forEach(function (btn) {
            btn.setAttribute("aria-pressed", btn.getAttribute("data-value") === state[key] ? "true" : "false");
          });
        });

        learnerBubble.textContent = LEARNER[state.interruption];
        learnerBubble.classList.toggle("cut", state.interruption === "often");
        yibuBubble.textContent = yibuReply();
        noteEl.textContent = INTERRUPT_NOTE[state.interruption];
        summaryEl.textContent = "";
        summaryEl.appendChild(document.createTextNode("当前设置："));

        var bits = [
          ["纠错", LABELS.correction[state.correction]],
          ["话题", LABELS.topic[state.topic]],
          ["打断", LABELS.interruption[state.interruption]]
        ];
        bits.forEach(function (bit, i) {
          if (i) summaryEl.appendChild(document.createTextNode(" · "));
          var strong = document.createElement("strong");
          strong.textContent = bit[0] + "：" + bit[1];
          summaryEl.appendChild(strong);
        });
      }

      function setSetting(key, value) {
        if (!ALLOWED[key] || !ALLOWED[key][value]) return;
        if (state[key] === value) return;
        state[key] = value;
        saveState();
        render();
      }

      document.querySelectorAll(".segments").forEach(function (group) {
        var key = group.getAttribute("data-setting");
        var buttons = Array.prototype.slice.call(group.querySelectorAll("button[data-value]"));

        buttons.forEach(function (btn, index) {
          btn.addEventListener("click", function () {
            setSetting(key, btn.getAttribute("data-value"));
          });

          btn.addEventListener("keydown", function (event) {
            var nextIndex = index;
            if (event.key === "ArrowRight" || event.key === "ArrowDown") {
              nextIndex = (index + 1) % buttons.length;
            } else if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
              nextIndex = (index - 1 + buttons.length) % buttons.length;
            } else if (event.key === "Home") {
              nextIndex = 0;
            } else if (event.key === "End") {
              nextIndex = buttons.length - 1;
            } else {
              return;
            }
            event.preventDefault();
            var target = buttons[nextIndex];
            setSetting(key, target.getAttribute("data-value"));
            target.focus();
          });
        });
      });

      resetBtn.addEventListener("click", function () {
        state.correction = DEFAULTS.correction;
        state.topic = DEFAULTS.topic;
        state.interruption = DEFAULTS.interruption;
        saveState();
        render();
      });

      render();
    })();
  </script>
</body>
</html>
