<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>一步 Yibu — 英语学习应用</title>
  <style>
    :root {
      --teal: #0d8f7e;
      --teal-dark: #0a6e61;
      --teal-deep: #08574d;
      --teal-soft: #e7f6f3;
      --teal-mid: #b9e3db;
      --bg: #f3f7f6;
      --bg-tint: #eaf3f1;
      --card: #ffffff;
      --ink: #142421;
      --muted: #5a6e69;
      --line: #d5e3df;
      --learner: #eef2f1;
      --shadow: 0 8px 28px rgba(20, 36, 33, 0.08), 0 1px 2px rgba(20, 36, 33, 0.04);
      --radius: 20px;
      --font: ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      --focus: 0 0 0 3px var(--card), 0 0 0 5px var(--teal);
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background:
        radial-gradient(1200px 500px at 10% -10%, #d9f3ee 0%, transparent 55%),
        radial-gradient(900px 400px at 100% 0%, #e8f4e8 0%, transparent 50%),
        var(--bg);
      color: var(--ink);
      line-height: 1.5;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      width: min(720px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 48px;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }

    .mark {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(160deg, #19b39f 0%, var(--teal-dark) 100%);
      color: #fff;
      font-weight: 750;
      font-size: 1.35rem;
      letter-spacing: -0.04em;
      display: grid;
      place-items: center;
      box-shadow: 0 6px 16px rgba(13, 143, 126, 0.28);
      flex-shrink: 0;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.35rem;
      letter-spacing: -0.03em;
      line-height: 1.2;
    }

    .brand p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid rgba(213, 227, 223, 0.8);
      padding: 22px 22px 20px;
    }

    .card + .card { margin-top: 16px; }

    .tutor-img {
      display: block;
      width: 200px;
      max-width: 60%;
      height: auto;
      aspect-ratio: 1 / 1;
      margin: 0 0 18px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--teal-mid);
      box-shadow: var(--shadow);
    }

    .hero h2 {
      margin: 0 0 10px;
      font-size: 1.55rem;
      letter-spacing: -0.03em;
      line-height: 1.3;
    }

    .hero .lede {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.65;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 10px 20px;
      border-radius: 14px;
      background: linear-gradient(160deg, #19b39f 0%, var(--teal-dark) 100%);
      color: #fff;
      font: inherit;
      font-weight: 650;
      font-size: 1rem;
      text-decoration: none;
      box-shadow: 0 6px 16px rgba(13, 143, 126, 0.28);
    }

    .cta:hover { filter: brightness(1.05); }

    .cta:focus { outline: none; }

    .cta:focus-visible { box-shadow: var(--focus), 0 6px 16px rgba(13, 143, 126, 0.28); }

    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 16px;
    }

    .feature {
      background: var(--card);
      border-radius: 16px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(213, 227, 223, 0.8);
      padding: 16px 16px 15px;
    }

    .feature h3 {
      margin: 0 0 6px;
      font-size: 0.98rem;
      letter-spacing: -0.02em;
      color: var(--teal-deep);
    }

    .feature p {
      margin: 0;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.55;
    }

    @media (max-width: 520px) {
      .app { width: min(720px, calc(100% - 20px)); padding-top: 20px; }
      .card { padding: 18px 16px 16px; border-radius: 16px; }
      .hero h2 { font-size: 1.35rem; }
      .tutor-img { width: 160px; margin-left: auto; margin-right: auto; }
      .features { grid-template-columns: 1fr; }
      .cta { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .cta { transition: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="mark" aria-hidden="true">Y</div>
      <div class="brand">
        <h1>一步 Yibu</h1>
        <p>你的贴心英语导师</p>
      </div>
    </header>

    <main>
      <section class="card hero" aria-labelledby="hero-heading">
        <img class="tutor-img" src="yibu-tutor.png" alt="一步 Yibu 语言学习助手" width="200" height="200">
        <h2 id="hero-heading">轻松开口，和一步一起练英语</h2>
        <p class="lede">一步是一款英语学习应用。你可以随时和导师一步聊天练习，围绕新闻或自己感兴趣的话题展开对话，并在需要时得到温和、清晰的纠正。想先看看一步会怎么回应？来调整一下导师设置吧。</p>
        <a class="cta" href="yibu-settings.html">打开导师设置</a>
      </section>

      <div class="features">
        <section class="feature">
          <h3>自由聊天</h3>
          <p>和一步自然对话，随时练习开口，不用担心说错。</p>
        </section>
        <section class="feature">
          <h3>温和纠错</h3>
          <p>从轻轻带过到认真讲解，纠正的严格程度由你决定。</p>
        </section>
        <section class="feature">
          <h3>按兴趣聊</h3>
          <p>自由闲聊、新闻时事，或围绕你喜欢的话题展开练习。</p>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
